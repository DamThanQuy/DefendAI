# ===== docker-compose.yml cho DefendAI =====
# Môi trường dev local - chạy 3 service: db, api, web
# Sử dụng: docker compose up --build
# (Docker Compose V2 không cần `version:` nữa)

services:
  # ========================================================================
  # Backend API (FastAPI + AI Gateway)
  # ========================================================================
  api:
    build: ./apps/api
    container_name: defense-api
    restart: unless-stopped
    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      # Database (trỏ về service "db" trong compose network)
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/defense_db
      # Routing
      DEFAULT_PROVIDER: localhost

      # Auth (cho tuần 2-3)
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # Google OAuth (điền Client ID từ Google Cloud Console)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      # Redis connection
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Mount code để dev có hot-reload
      - ./apps/api:/app
      # Exclude __pycache__ để tận dụng Docker layer
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - defense-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ========================================================================
  # Frontend (Next.js)
  # ========================================================================
  web:
    build: ./apps/web
    container_name: defense-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Browser chạy trên host → dùng localhost:8000 (host port mapping của api).
      # "api" chỉ resolve được BẢO trong Docker network, không resolve từ browser.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_URL: http://api:8000
      # Google OAuth Client ID (phải trùng với GOOGLE_CLIENT_ID bên api)
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Bind mount Windows->Linux không phát inotify event, phải poll mới hot reload.
      # Next 14 dùng watchpack (WATCHPACK_POLLING); CHOKIDAR_* chỉ dành cho CRA.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - defense-net
    command: npm run dev

  # ========================================================================
  # Database (PostgreSQL 16)
  # ========================================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: defense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: defense_db
    ports:
      - "5433:5432"  # Host 5433 → Container 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - defense-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d defense_db"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========================================================================
  # Object Storage (MinIO) — file uploads thay cho disk local
  # ========================================================================
  minio:
    image: minio/minio
    container_name: defense-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_DOMAIN: localhost
    volumes:
      - ./data/minio:/data
    networks:
      - defense-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========================================================================
  # Background worker — processes async jobs from Redis queue (single process)
  # ========================================================================
  worker:
    build: ./apps/api
    container_name: defense-worker
    restart: unless-stopped
    entrypoint: [""]
    command: python worker_main.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/defense_db
      REDIS_URL: redis://redis:6379/0
      DEFAULT_PROVIDER: localhost
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    volumes:
      - ./apps/api:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - defense-net

  # ========================================================================
  # Multi-process worker (Cách B) — song song xử lý code_scan_module jobs.
  # Scale: docker compose up -d --scale worker_multi=N
  # ========================================================================
  worker_multi:
    build: ./apps/api
    container_name: defense-worker-multi
    restart: unless-stopped
    entrypoint: [""]
    command: python worker_multi.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/defense_db
      REDIS_URL: redis://redis:6379/0
      DEFAULT_PROVIDER: localhost
      WORKER_PROCESSES: 4
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    volumes:
      - ./apps/api:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9091/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - defense-net

  # ========================================================================
  # Redis — async job queue backbone
  # ========================================================================
  redis:
    image: redis:7-alpine
    container_name: defense-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - defense-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

# ========================================================================
# Volumes (persistent data)
# ========================================================================
volumes:
  postgres_data:
    name: defense_postgres_data
  minio_data:
    name: defense_minio_data
  redis_data:
    name: defense_redis_data

# ========================================================================
# Networks
# ========================================================================
networks:
  defense-net:
    name: defense-net
    driver: bridge