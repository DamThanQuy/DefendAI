# ===== docker-compose.yml cho DefendAI (Server Optimized Backend) =====
# Frontend prod: https://defend-ai.vercel.app (Vercel Cloud)
# Backend: db, redis, minio, api, worker, worker_multi
# Frontend local (service `web`): nằm trong profile "web" — xem ghi chú bên dưới
# Tối ưu: RAM Disk tmpfs /tmp, Postgres in-memory WAL buffer, Redis in-memory queue, no swap
#
# ------------------------------------------------------------------------
# CHẠY CẢ FE + BE LOCAL CHỈ BẰNG 1 LỆNH:
#   Thêm dòng sau vào file .env (cùng cấp file này, đã gitignore):
#       COMPOSE_PROFILES=web
#   Rồi:  docker compose up -d      → FE http://localhost:3000 + BE http://localhost:8000
#
#   Không muốn FE (chỉ BE, như trên server): bỏ dòng đó, hoặc
#       docker compose up -d                     (không có web)
#       docker compose --profile web up -d       (bật web tạm thời 1 lần)
#
#   Service `web` để trong profile để KHÔNG phá deploy trên server
#   (server đang chạy container `defense-web` bằng docker run tay — trùng tên).
# ------------------------------------------------------------------------

services:
  # ========================================================================
  # Backend API (FastAPI + AI Gateway)
  # ========================================================================
  api:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        mode: "non-blocking"
    build: ./apps/api
    container_name: defense-api
    restart: unless-stopped
    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/defense_db
      DEFAULT_PROVIDER: localhost
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      REDIS_URL: redis://redis:6379/0
      LOCAL_MODEL: ${LOCAL_MODEL:-agnes-2.5-flash}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-https://apihub.agnes-ai.com/v1}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-sk-x4yIzIz3M26SDmJLrPsjbXSwDUxL8HMrVehmAdrOVWSnqqsX}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_MOMO_PHONE: ${PAYOS_MOMO_PHONE:-}
      PAYOS_MOMO_NAME: ${PAYOS_MOMO_NAME:-}
      PAYOS_BANK_BIN: ${PAYOS_BANK_BIN:-970422}
      PAYOS_BANK_ACCOUNT: ${PAYOS_BANK_ACCOUNT:-}
      PAYOS_BANK_ACCOUNT_NAME: ${PAYOS_BANK_ACCOUNT_NAME:-}
    volumes:
      - ./apps/api:/app
      - /app/__pycache__
    tmpfs:
      - /tmp:size=1G,uid=1000,gid=1000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - defense-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ========================================================================
  # Database (PostgreSQL 16) - Optimized RAM Buffer
  # ========================================================================
  db:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        mode: "non-blocking"
    image: pgvector/pgvector:pg16
    container_name: defense-db
    restart: unless-stopped
    command: postgres -c synchronous_commit=off -c shared_buffers=256MB -c wal_buffers=16MB -c work_mem=16MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: defense_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - defense-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d defense_db"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========================================================================
  # Object Storage (MinIO)
  # ========================================================================
  minio:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        mode: "non-blocking"
    image: minio/minio
    container_name: defense-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_DOMAIN: localhost
    volumes:
      - ./data/minio:/data
    networks:
      - defense-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========================================================================
  # Background worker (single process) - with RAM Disk tmpfs
  # ========================================================================
  worker:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        mode: "non-blocking"
    build: ./apps/api
    container_name: defense-worker
    restart: unless-stopped
    entrypoint: [""]
    command: python worker_main.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/defense_db
      REDIS_URL: redis://redis:6379/0
      DEFAULT_PROVIDER: localhost
      LOCAL_MODEL: ${LOCAL_MODEL:-agnes-2.5-flash}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-https://apihub.agnes-ai.com/v1}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-sk-x4yIzIz3M26SDmJLrPsjbXSwDUxL8HMrVehmAdrOVWSnqqsX}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      EMBED_BATCH_SIZE: "64"
      EMBED_REQUEST_DELAY: "1.5"
      NVIDIA_EMBED_API_KEY: ${NVIDIA_EMBED_API_KEY:-}
      NVIDIA_EMBED_MODEL: ${NVIDIA_EMBED_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2}
      NVIDIA_EMBED_TEXT_MODEL: ${NVIDIA_EMBED_TEXT_MODEL:-nvidia/nemotron-3-embed-1b}
      NVIDIA_EMBED_BASE_URL: ${NVIDIA_EMBED_BASE_URL:-https://integrate.api.nvidia.com/v1}
    volumes:
      - ./apps/api:/app
      - /app/__pycache__
    tmpfs:
      - /tmp:size=1G,uid=1000,gid=1000
      - /var/lib/defendai/analysis-tmp:size=1G,uid=1000,gid=1000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9091/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - defense-net

  # ========================================================================
  # Multi-process worker (2 processes for HDD stability + RAM Disk)
  # ========================================================================
  worker_multi:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        mode: "non-blocking"
    build: ./apps/api
    container_name: defense-worker-multi
    restart: unless-stopped
    entrypoint: [""]
    command: python worker_multi.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/defense_db
      REDIS_URL: redis://redis:6379/0
      DEFAULT_PROVIDER: localhost
      LOCAL_MODEL: ${LOCAL_MODEL:-agnes-2.5-flash}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-https://apihub.agnes-ai.com/v1}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-sk-x4yIzIz3M26SDmJLrPsjbXSwDUxL8HMrVehmAdrOVWSnqqsX}
      WORKER_PROCESSES: 4

      EMBED_BATCH_SIZE: "64"
      EMBED_REQUEST_DELAY: "1.5"
      NVIDIA_EMBED_API_KEY: ${NVIDIA_EMBED_API_KEY:-}
      NVIDIA_EMBED_MODEL: ${NVIDIA_EMBED_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2}
      NVIDIA_EMBED_TEXT_MODEL: ${NVIDIA_EMBED_TEXT_MODEL:-nvidia/nemotron-3-embed-1b}
      NVIDIA_EMBED_BASE_URL: ${NVIDIA_EMBED_BASE_URL:-https://integrate.api.nvidia.com/v1}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    volumes:
      - ./apps/api:/app
      - /app/__pycache__
    tmpfs:
      - /tmp:size=1G,uid=1000,gid=1000
      - /var/lib/defendai/analysis-tmp:size=1G,uid=1000,gid=1000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9091/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - defense-net

  # ========================================================================
  # Redis - in-memory queue
  # ========================================================================
  redis:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        mode: "non-blocking"
    image: redis:7-alpine
    container_name: defense-redis
    restart: unless-stopped
    command: redis-server --appendonly no --save 300 1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - defense-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========================================================================
  # Frontend (Next.js dev server) — LOCAL ONLY, nằm trong profile "web"
  # ------------------------------------------------------------------------
  # Bật bằng COMPOSE_PROFILES=web trong .env, hoặc `docker compose --profile web up -d`.
  #
  # Lưu ý kỹ thuật:
  #  - Bind-mount ./apps/web:/app để có hot-reload, nhưng PHẢI che /app/node_modules
  #    và /app/.next bằng named volume: node_modules + .next trên host là bản build
  #    Windows, nếu lọt vào container Linux sẽ hỏng native binary (swc) và cache
  #    NEXT_PUBLIC_* cũ bị inline cứng. Named volume được Docker tự seed từ image
  #    (đã `npm install` Linux) ở lần tạo đầu tiên.
  #  - BACKEND_URL = http://api:8000 (docker network) cho các BFF route server-side.
  #  - NEXT_PUBLIC_API_URL = http://localhost:8000 cho browser (WebSocket /api/meetings,
  #    /api/mock-qa — browser không resolve được host `api`).
  #  - Muốn FE local trỏ BE PRODUCTION: thêm vào .env
  #      WEB_BACKEND_URL=http://26.161.35.68:8000
  #      WEB_PUBLIC_API_URL=http://26.161.35.68:8000
  # ========================================================================
  web:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        mode: "non-blocking"
    build: ./apps/web
    image: defendai-web
    container_name: defense-web
    restart: unless-stopped
    profiles: ["web"]
    ports:
      - "3000:3000"
    environment:
      # Server-side (BFF routes + next.config.js rewrites) → đi trong docker network
      BACKEND_URL: ${WEB_BACKEND_URL:-http://api:8000}
      NEXT_PUBLIC_BACKEND_URL: ${WEB_BACKEND_URL:-http://api:8000}
      # Client-side (browser) → phải là host reachable
      NEXT_PUBLIC_API_URL: ${WEB_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      # Che node_modules + .next của host (Windows) bằng bản Linux của container
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "tkm1.taildec640.ts.net:103.84.155.153"
    networks:
      - defense-net

# ========================================================================
# Volumes (persistent data)
# ========================================================================
volumes:
  postgres_data:
    name: defense_postgres_data
  minio_data:
    name: defense_minio_data
  redis_data:
    name: defense_redis_data
  web_node_modules:
    name: defense_web_node_modules
  web_next:
    name: defense_web_next

# ========================================================================
# Networks
# ========================================================================
networks:
  defense-net:
    name: defense-net
    driver: bridge
